{% extends "main/base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="col-md-5 mx-auto">
  <h2>Вход</h2>
  {% if form.errors %}
    <div class="alert alert-danger">Неверный логин или пароль.</div>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="mb-3 {% if form.errors %}has-error{% endif %}">
      <label class="form-label" for="{{ form.username.id_for_label }}">Логин</label>
      <input type="text" name="username" id="{{ form.username.id_for_label }}" class="form-control" required>
    </div>
    <div class="mb-3 {% if form.errors %}has-error{% endif %}">
      <label class="form-label" for="{{ form.password.id_for_label }}">Пароль</label>
      <input type="password" name="password" id="{{ form.password.id_for_label }}" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary">Войти</button>
    <a href="{% url 'register' %}" class="btn btn-link">Регистрация</a>
  </form>
</div>
{% endblock %}
