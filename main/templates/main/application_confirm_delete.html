{% extends "main/base.html" %}
{% block title %}Удаление заявки{% endblock %}
{% block content %}
<div class="col-md-6 mx-auto">
  <h2>Удаление заявки</h2>
  <p>Вы действительно хотите удалить заявку «{{ application.title }}»?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a href="{% url 'profile' %}" class="btn btn-secondary">Отмена</a>
  </form>
</div>
{% endblock %}
